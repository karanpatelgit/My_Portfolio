<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>LifeOS</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#08111d">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="icon" href="assets/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-192.png">

</head>

<body>

<div id="loader">
    Loading LifeOS...
</div>

<div id="app">

<header>

<div class="greeting">
Good Morning
</div>

<h1>LifeOS</h1>

<p id="todayDate"></p>

</header>

<main id="content">

<section id="dashboard"></section>

<section id="timeline" class="hidden"></section>

<section id="analytics" class="hidden"></section>

<section id="mood" class="hidden"></section>

<section id="settings" class="hidden"></section>

</main>

<nav class="bottom-nav">

<button data-page="dashboard" class="active">
<span class="material-icons-round">home</span>
</button>

<button data-page="timeline">
<span class="material-icons-round">event</span>
</button>

<button data-page="analytics">
<span class="material-icons-round">analytics</span>
</button>

<button data-page="mood">
<span class="material-icons-round">sentiment_satisfied</span>
</button>

<button data-page="settings">
<span class="material-icons-round">settings</span>
</button>

</nav>

<button id="fab">
<span class="material-icons-round">
refresh
</span>
</button>

</div>

<script src="api.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
<script>

if("serviceWorker" in navigator){

window.addEventListener("load",()=>{

navigator.serviceWorker.register("sw.js");

});

}

</script>
</body>
</html>
